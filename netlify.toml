# إعدادات نشر نسخة الويب على Netlify.
# وجودها هنا يعني أن البناء معرّف داخل المستودع، فلا يحتاج ضبطاً يدوياً في لوحة Netlify
# ولا يختلف من نشرة إلى أخرى.

[build]
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  # Expo SDK 54 يحتاج Node 20 فما فوق
  NODE_VERSION = "20"
  # يتخطّى فحص إصدارات الحزم عبر الشبكة — الإصدارات مثبّتة في package.json،
  # فلا داعي لأن يفشل النشر بسبب تعذّر الوصول إلى خوادم Expo
  EXPO_OFFLINE = "1"

# التطبيق صفحة واحدة: أي مسار يُخدَم من index.html بدل صفحة 404.
# لوحة المعلم تُفتح بالعنوان ‎/#teacher‎ وهو جزء تجزئة لا يحتاج توجيهاً،
# لكن هذا يحمي أي رابط آخر يُكتب يدوياً.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
